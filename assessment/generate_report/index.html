<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activity Report</title>
<style>
  :root { --accent:#0f6e56; --accent-dark:#085041; --border:#e4e6eb; --muted:#6b7280; --ink:#12151c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f2f3f5; color:#1f2430; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 60px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0 0 20px; }

  .card { background:#fff; border:1px solid var(--border); border-radius:10px; }
  .status-bar { padding:10px 16px; margin-bottom:16px; font-size:12.5px; color: var(--muted); display:flex; align-items:center; gap:10px; }
  .status-bar.ok { color: var(--accent); font-weight: 600; }
  .status-bar.err { color: #b3261e; font-weight: 600; }
  .status-dot { width:7px; height:7px; border-radius:50%; background:#9aa0ab; flex-shrink:0; }
  .status-bar.ok .status-dot { background: var(--accent); }
  .status-bar.err .status-dot { background: #b3261e; }

  .filters { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; padding:14px 16px; margin-bottom:18px; }
  .field { display:flex; flex-direction:column; gap:5px; min-width:140px; }
  .field label { font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); }
  select, input[type=date] { border:1px solid #d5d8de; border-radius:6px; padding:7px 10px; font-size:13px; background:#fff; color:var(--ink); }
  .search-wrap { position:relative; flex:1; min-width:200px; }
  .search-box { display:flex; align-items:center; gap:6px; border:1px solid #d5d8de; border-radius:6px; padding:7px 10px; }
  .search-box svg { color:#9aa0ab; flex-shrink:0; }
  .search-box input { border:none; outline:none; font-size:13px; flex:1; }
  .dropdown { position:absolute; top:100%; left:0; right:0; margin-top:4px; background:#fff; border:1px solid var(--border); border-radius:6px; box-shadow:0 4px 12px rgba(20,20,30,.08); z-index:20; max-height:200px; overflow-y:auto; display:none; }
  .dropdown.open { display:block; }
  .dropdown-item { padding:8px 12px; font-size:13px; cursor:pointer; }
  .dropdown-item:hover { background:#f2f4f7; }
  .generate-btn { background: var(--accent); color:#fff; border:none; border-radius:6px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; margin-left:auto; }
  .generate-btn:hover { background: var(--accent-dark); }
  .generate-btn:disabled { background:#c7cad1; cursor:not-allowed; }
  .error-msg { color:#b3261e; font-size:12.5px; margin:-8px 0 14px 2px; display:none; }
  .error-msg.show { display:block; }

  .empty-state { text-align:center; padding:48px 20px; color:var(--muted); font-size:14px; }
  .empty-state strong { display:block; font-size:15px; color:var(--ink); margin-bottom:6px; }

  .report-header { padding:14px 16px; margin-bottom:14px; }
  .report-kicker { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:0 0 8px; }
  .report-meta { display:flex; flex-wrap:wrap; gap:20px; font-size:14px; }
  .report-meta b { color:var(--ink); }
  .report-range { font-size:12.5px; color:var(--muted); margin-top:6px; }

  .summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  .summary-card { padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .summary-label { font-size:11.5px; color:var(--muted); font-weight:600; }
  .summary-value { font-size:20px; font-weight:700; color:var(--ink); }

  .chart-card { padding:16px; }
  .chart-title { font-size:14px; font-weight:600; margin:0 0 14px; color:var(--ink); }
  .chart-body { display:flex; }
  .y-axis { display:flex; flex-direction:column; justify-content:space-between; height:200px; padding-right:8px; font-size:10.5px; color:#9aa0ab; text-align:right; }
  .chart-scroll { overflow-x:auto; flex:1; padding-bottom:4px; position:relative; }
  .chart-inner { position:relative; min-width:100%; }
  .gridlines { position:absolute; top:0; left:0; right:0; height:200px; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; }
  .gridline { border-top:1px solid #eef0f3; }
  .bars { display:flex; align-items:flex-end; height:200px; position:relative; }
  .bar-col { width:8px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; position:relative; }
  .newday { border-left:1px dashed #d5d8de; }
  .day-label { position:absolute; top:-18px; left:4px; font-size:10.5px; font-weight:600; color:#4b5262; white-space:nowrap; }
  .bar-track { width:100%; height:100%; display:flex; align-items:flex-end; justify-content:center; }
  .bar { width:95%; background:var(--accent); border-radius:3px 3px 0 0; cursor:pointer; transition:background .1s; }
  .bar:hover { background: var(--accent-dark); }
  .hour-label { position:absolute; bottom:-18px; font-size:9.5px; color:#9aa0ab; white-space:nowrap; }
  .tooltip { position:absolute; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:11.5px; padding:8px 10px; border-radius:6px; z-index:30; pointer-events:none; white-space:nowrap; display:none; }
  .tooltip-date { font-weight:600; margin-bottom:2px; }
  .tooltip-range { color:#c7cad1; margin-bottom:4px; }
  .tooltip-count { font-weight:600; }
  .scroll-hint { text-align:center; font-size:11px; color:var(--muted); margin:24px 0 0; }

  @media (max-width:640px) {
    .filters { flex-direction:column; align-items:stretch; }
    .generate-btn { margin-left:0; width:100%; }
    .summary-grid { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Activity Report</h1>
  <p class="subtitle">Select a student or team, choose a date range, and see hourly request activity (Asia/Dhaka time).</p>

  <div class="card status-bar" id="statusBar">
    <span class="status-dot"></span>
    <span id="statusText">Loading activity data…</span>
  </div>

  <div class="card filters">
    <div class="field">
      <label for="typeSelect">Type</label>
      <select id="typeSelect">
        <option value="student">Student</option>
        <option value="team">Team</option>
      </select>
    </div>

    <div class="field search-wrap">
      <label>Search</label>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search student ID..." autocomplete="off" />
      </div>
      <div class="dropdown" id="dropdown"></div>
    </div>

    <div class="field">
      <label for="startDate">Start date</label>
      <input type="date" id="startDate" />
    </div>
    <div class="field">
      <label for="endDate">End date</label>
      <input type="date" id="endDate" />
    </div>

    <button class="generate-btn" id="generateBtn">Generate report</button>
  </div>

  <p class="error-msg" id="errorMsg"></p>

  <div id="resultArea"></div>
</div>

<script>
/* ============================================================
   Activity Report — frontend
   Fetches parsed activity data from the backend (GET /api/activity).
   No CSV handling happens in the browser at all.
   ============================================================ */

const DHAKA_TZ = "Asia/Dhaka";
const PX_PER_HOUR = 44;
const CHART_HEIGHT = 200;

let activities = [];
let selectedId = null;
let reportType = "student";
const offeringFilter = new URLSearchParams(window.location.search).get("offering");

function toDhakaParts(isoString) {
  const d = new Date(isoString);
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: DHAKA_TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", hourCycle:"h23" });
  const parts = {};
  fmt.formatToParts(d).forEach(p => parts[p.type] = p.value);
  return { year:+parts.year, month:+parts.month, day:+parts.day, hour:+parts.hour };
}
function dateKeyOf(p){ return `${p.year}-${String(p.month).padStart(2,"0")}-${String(p.day).padStart(2,"0")}`; }
function bucketKeyOf(p){ return `${dateKeyOf(p)}T${String(p.hour).padStart(2,"0")}`; }
function addDaysToKey(dateKey, days) {
  const [y,m,d] = dateKey.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`;
}
function formatDateLabel(dateKey) {
  const [y,m,d] = dateKey.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"});
}
function formatDateShort(dateKey) {
  const [y,m,d] = dateKey.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{day:"numeric",month:"short",timeZone:"UTC"});
}
function formatHourLabel(hour) {
  const h12 = hour % 12 === 0 ? 12 : hour % 12;
  return `${h12} ${hour < 12 ? "AM" : "PM"}`;
}
function buildBuckets(startDate, endDate) {
  const buckets = [];
  let cursor = startDate, guard = 0;
  while (cursor <= endDate && guard < 4000) {
    for (let hour=0; hour<24; hour++) buckets.push({ dateKey: cursor, hour, key: `${cursor}T${String(hour).padStart(2,"0")}` });
    if (cursor === endDate) break;
    cursor = addDaysToKey(cursor, 1);
    guard++;
  }
  return buckets;
}

const typeSelect = document.getElementById("typeSelect");
const searchInput = document.getElementById("searchInput");
const dropdown = document.getElementById("dropdown");
const startDateInput = document.getElementById("startDate");
const endDateInput = document.getElementById("endDate");
const generateBtn = document.getElementById("generateBtn");
const errorMsg = document.getElementById("errorMsg");
const resultArea = document.getElementById("resultArea");
const statusBar = document.getElementById("statusBar");
const statusText = document.getElementById("statusText");

function distinctIds(field) {
  return Array.from(new Set(activities.map(a => String(a[field])))).sort();
}

function renderDropdown() {
  const field = reportType === "student" ? "student_id" : "team_id";
  const options = distinctIds(field);
  const text = searchInput.value.trim().toLowerCase();
  const filtered = (text ? options.filter(o => o.toLowerCase().includes(text)) : options).slice(0, 8);
  dropdown.innerHTML = "";
  filtered.forEach(id => {
    const item = document.createElement("div");
    item.className = "dropdown-item";
    item.textContent = id;
    item.addEventListener("mousedown", () => {
      searchInput.value = id;
      selectedId = id;
      dropdown.classList.remove("open");
    });
    dropdown.appendChild(item);
  });
  dropdown.classList.toggle("open", filtered.length > 0);
}

typeSelect.addEventListener("change", () => {
  reportType = typeSelect.value;
  searchInput.placeholder = reportType === "student" ? "Search student ID..." : "Search team ID...";
  searchInput.value = "";
  selectedId = null;
  renderDropdown();
});
searchInput.addEventListener("focus", renderDropdown);
searchInput.addEventListener("input", () => { selectedId = null; renderDropdown(); });
searchInput.addEventListener("blur", () => setTimeout(() => dropdown.classList.remove("open"), 120));

function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add("show"); }
function clearError() { errorMsg.textContent = ""; errorMsg.classList.remove("show"); }

function buildTooltipEl() {
  const el = document.createElement("div");
  el.className = "tooltip";
  el.innerHTML = `<div class="tooltip-date"></div><div class="tooltip-range"></div><div class="tooltip-count"></div>`;
  return el;
}

function renderChart(buckets, countMap) {
  const maxCount = buckets.reduce((m,b) => Math.max(m, countMap.get(b.key) || 0), 0) || 1;
  const labelEvery = buckets.length <= 30 ? 1 : buckets.length <= 100 ? 3 : buckets.length <= 300 ? 6 : 12;
  const yTicks = [0,.25,.5,.75,1].map(f => Math.round(maxCount * f));

  const card = document.createElement("div");
  card.className = "card chart-card";
  card.innerHTML = `<h3 class="chart-title">Requests by hour</h3>`;

  const body = document.createElement("div");
  body.className = "chart-body";

  const yAxis = document.createElement("div");
  yAxis.className = "y-axis";
  yTicks.slice().reverse().forEach(t => {
    const s = document.createElement("span");
    s.textContent = t;
    yAxis.appendChild(s);
  });

  const scrollDiv = document.createElement("div");
  scrollDiv.className = "chart-scroll";
  const inner = document.createElement("div");
  inner.className = "chart-inner";
  inner.style.width = (buckets.length * PX_PER_HOUR) + "px";

  const gridlines = document.createElement("div");
  gridlines.className = "gridlines";
  yTicks.forEach(() => gridlines.appendChild(Object.assign(document.createElement("div"), {className:"gridline"})));

  const barsDiv = document.createElement("div");
  barsDiv.className = "bars";

  const tooltip = buildTooltipEl();

  buckets.forEach((b, i) => {
    const count = countMap.get(b.key) || 0;
    const isNewDay = i === 0 || buckets[i-1].dateKey !== b.dateKey;
    const barH = count === 0 ? 0 : Math.max(2, (count / maxCount) * CHART_HEIGHT);
    const showLabel = i % labelEvery === 0;

    const col = document.createElement("div");
    col.className = "bar-col" + (isNewDay ? " newday" : "");

    if (isNewDay) {
      const dl = document.createElement("span");
      dl.className = "day-label";
      dl.textContent = formatDateShort(b.dateKey);
      col.appendChild(dl);
    }

    const track = document.createElement("div");
    track.className = "bar-track";
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = barH + "px";
    bar.addEventListener("mouseenter", () => {
      const rect = bar.getBoundingClientRect();
      const wrapRect = scrollDiv.getBoundingClientRect();
      tooltip.style.left = (rect.left - wrapRect.left + scrollDiv.scrollLeft + rect.width/2) + "px";
      tooltip.style.top = Math.max(0, rect.top - wrapRect.top - 54) + "px";
      tooltip.querySelector(".tooltip-date").textContent = formatDateLabel(b.dateKey);
      tooltip.querySelector(".tooltip-range").textContent = `${formatHourLabel(b.hour)} – ${formatHourLabel((b.hour+1)%24)}`;
      tooltip.querySelector(".tooltip-count").textContent = `Requests: ${count}`;
      tooltip.style.display = "block";
    });
    bar.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
    track.appendChild(bar);
    col.appendChild(track);

    if (showLabel) {
      const hl = document.createElement("span");
      hl.className = "hour-label";
      hl.textContent = formatHourLabel(b.hour);
      col.appendChild(hl);
    }
    barsDiv.appendChild(col);
  });

  inner.appendChild(gridlines);
  inner.appendChild(barsDiv);
  inner.appendChild(tooltip);
  scrollDiv.appendChild(inner);
  body.appendChild(yAxis);
  body.appendChild(scrollDiv);
  card.appendChild(body);

  const hint = document.createElement("p");
  hint.className = "scroll-hint";
  hint.textContent = "← scroll horizontally →";
  card.appendChild(hint);

  return card;
}

function generateReport() {
  clearError();
  if (!selectedId) { showError(`Select a ${reportType} ID before generating a report.`); return; }
  const startDate = startDateInput.value, endDate = endDateInput.value;
  if (!startDate || !endDate) { showError("Choose both a start date and an end date."); return; }
  if (startDate > endDate) { showError("Start date must be before the end date."); return; }

  const matchField = reportType === "student" ? "student_id" : "team_id";
  const filtered = activities.filter(a => {
    if (String(a[matchField]) !== String(selectedId)) return false;
    const dk = dateKeyOf(toDhakaParts(a.started_at));
    return dk >= startDate && dk <= endDate;
  });

  resultArea.innerHTML = "";

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card empty-state";
    empty.innerHTML = `<strong>No activity found</strong>${reportType === "student" ? "Student" : "Team"} ${selectedId} has no recorded requests during the selected period.`;
    resultArea.appendChild(empty);
    return;
  }

  const countMap = new Map();
  let teamOfStudent = null;
  filtered.forEach(a => {
    const key = bucketKeyOf(toDhakaParts(a.started_at));
    countMap.set(key, (countMap.get(key) || 0) + 1);
    if (reportType === "student" && !teamOfStudent) teamOfStudent = a.team_id;
  });

  const buckets = buildBuckets(startDate, endDate);
  let peakBucket = null, peakCount = 0, activeHours = 0;
  buckets.forEach(b => {
    const c = countMap.get(b.key) || 0;
    if (c > 0) activeHours++;
    if (c > peakCount) { peakCount = c; peakBucket = b; }
  });

  const header = document.createElement("div");
  header.className = "card report-header";
  header.innerHTML = `
    <p class="report-kicker">${reportType === "student" ? "Student activity report" : "Team activity report"}</p>
    <div class="report-meta">
      <span>${reportType === "student" ? "Student" : "Team"}: <b>${selectedId}</b></span>
      ${reportType === "student" && teamOfStudent ? `<span>Team: <b>${teamOfStudent}</b></span>` : ""}
    </div>
    <p class="report-range">${formatDateLabel(startDate)} — ${formatDateLabel(endDate)}</p>
  `;

  const summary = document.createElement("div");
  summary.className = "summary-grid";
  const cards = [
    ["Total requests", filtered.length],
    ["Active hours", activeHours],
    ["Peak hour", peakBucket ? `${formatDateShort(peakBucket.dateKey)} · ${formatHourLabel(peakBucket.hour)}` : "—"],
    ["Peak requests", peakCount],
  ];
  cards.forEach(([label, value]) => {
    const c = document.createElement("div");
    c.className = "card summary-card";
    c.innerHTML = `<span class="summary-label">${label}</span><span class="summary-value">${value}</span>`;
    summary.appendChild(c);
  });

  resultArea.appendChild(header);
  resultArea.appendChild(summary);
  resultArea.appendChild(renderChart(buckets, countMap));
}

generateBtn.addEventListener("click", generateReport);

/* ---------- load data from the backend ---------- */
async function loadActivities() {
  try {
    const res = await fetch("/admin/reports/data");
    if (!res.ok) throw new Error(`Server responded ${res.status}`);
    activities = await res.json();
    if (offeringFilter) {
      activities = activities.filter((row) => String(row.offering_id) === String(offeringFilter));
    }
    statusBar.className = "card status-bar ok";
    statusText.textContent = offeringFilter
      ? `Connected — ${activities.length} activity records loaded for offering ${offeringFilter}.`
      : `Connected — ${activities.length} activity records loaded from the server.`;
  } catch (err) {
    statusBar.className = "card status-bar err";
    statusText.textContent = `Could not load activity data: ${err.message}`;
  }
}
loadActivities();
</script>
</body>
</html>
